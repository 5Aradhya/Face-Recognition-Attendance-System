<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance Records</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
        }

        header {
            background-color: #2c3e50;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: white;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
        }

        header a:hover {
            background-color: #1abc9c;
        }

        nav {
            background-color: #34495e;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
        }

        nav ul li a:hover {
            background-color: #1abc9c;
        }

        .page-title {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .btn {
            display: inline-block;
            background-color: #1abc9c;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn:hover {
            background-color: #16a085;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:nth-child(even) {
            background-color: #f9fafb;
        }

        tr:hover {
            background-color: #e8f8f5;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>
<body>
<header>
    <h1>Face Attendance System</h1>
    <a th:href="@{/dashboard}">Dashboard</a>
</header>

<nav>
    <ul>
        <li><a th:href="@{/students/view}">View Students</a></li>
        <li><a th:href="@{/students/add}">Add Student</a></li>
        <li><a th:href="@{/attendance}">View Attendance</a></li>
    </ul>
</nav>

<h2 class="page-title">Attendance Records</h2>

<div class="container">
    <a class="btn" th:href="@{/mark-attendance}">+ Mark New Attendance</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Student Name</th>
            <th>Date</th>
            <th>Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="record : ${attendanceList}">
            <td th:text="${record.id}"></td>
            <td th:text="${record.studentName}"></td>
            <td th:text="${record.date}"></td>
            <td th:text="${record.time}"></td>
        </tr>
        </tbody>
    </table>
</div>

<footer>
    <p>&copy; 2026 Face Attendance System</p>
</footer>
</body>
</html>
