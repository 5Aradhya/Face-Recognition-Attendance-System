<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
        }

        header {
            background-color: #2c3e50;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: white;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
        }

        header a:hover {
            background-color: #1abc9c;
        }

        .register-box {
            max-width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-top: 4px solid #1abc9c;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .register-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .register-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .register-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .register-box input:focus {
            outline: none;
            border-color: #1abc9c;
        }

        .register-box button {
            width: 100%;
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        .register-box button:hover {
            background-color: #16a085;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-link a {
            color: #1abc9c;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            color: #16a085;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>
<body>
<header>
    <h1>Face Attendance System</h1>
    <a th:href="@{/}">Home</a>
</header>

<div class="register-box">
    <h2>Register</h2>

    <form id="registerForm">
        <label>Username:</label>
        <input type="text" id="username" required>

        <label>Password:</label>
        <input type="password" id="password" required>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <p class="switch-link">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>

<footer>
    <p>&copy; 2026 Face Attendance System</p>
</footer>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        });

        if (response.ok) {
            document.getElementById('message').style.color = '#27ae60';
            document.getElementById('message').innerText = 'Registered successfully! You can now login.';
        } else {
            document.getElementById('message').style.color = '#e74c3c';
            document.getElementById('message').innerText = 'Registration failed.';
        }
    });
</script>
</body>
</html>
