<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
        }

        header {
            background-color: #2c3e50;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: white;
            font-size: 26px;
        }

        #logoutBtn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        #logoutBtn:hover {
            background-color: #c0392b;
        }

        nav {
            background-color: #34495e;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
        }

        nav ul li a:hover {
            background-color: #1abc9c;
        }

        .section-title {
            max-width: 1000px;
            margin: 40px auto 15px auto;
            padding: 0 20px;
        }

        .stats {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .stat-card {
            flex: 1;
            background-color: white;
            padding: 25px;
            border-top: 4px solid #1abc9c;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card p {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .stat-card span {
            font-size: 38px;
            font-weight: bold;
            color: #1abc9c;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>
<body>
<header>
    <h1>Dashboard</h1>
    <button id="logoutBtn">Logout</button>
</header>

<nav>
    <ul>
        <li><a th:href="@{/students/view}">View Students</a></li>
        <li><a th:href="@{/students/add}">Add Student</a></li>
        <li><a th:href="@{/attendance}">View Attendance</a></li>
    </ul>
</nav>

<h2 class="section-title">Quick Stats</h2>
<div class="stats">
    <div class="stat-card">
        <p>Total Students</p>
        <span id="studentCount">Loading...</span>
    </div>
    <div class="stat-card">
        <p>Total Attendance Records</p>
        <span id="attendanceCount">Loading...</span>
    </div>
</div>

<footer>
    <p>&copy; 2026 Face Attendance System</p>
</footer>

<script>
    const token = localStorage.getItem('jwtToken');

    if (!token) {
        window.location.href = '/login';
    }

    async function loadStats() {
        try {
            const studentsResponse = await fetch('/api/students', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const students = await studentsResponse.json();
            document.getElementById('studentCount').innerText = students.length;

            const attendanceResponse = await fetch('/api/attendance/all', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const attendance = await attendanceResponse.json();
            document.getElementById('attendanceCount').innerText = attendance.length;
        } catch (error) {
            console.error('Error loading stats:', error);
        }
    }

    loadStats();

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('jwtToken');
        window.location.href = '/login';
    });
</script>
</body>
</html>
