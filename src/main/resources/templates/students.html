<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
        }

        header {
            background-color: #2c3e50;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: white;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
        }

        header a:hover {
            background-color: #1abc9c;
        }

        nav {
            background-color: #34495e;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
        }

        nav ul li a:hover {
            background-color: #1abc9c;
        }

        .page-title {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .add-btn-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #1abc9c;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            margin-right: 6px;
        }

        .btn:hover {
            background-color: #16a085;
        }

        .btn-delete {
            background-color: #e74c3c;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        table {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            table-layout: fixed;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e0e0e0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        tr:nth-child(even) {
            background-color: #f9fafb;
        }

        tr:hover {
            background-color: #e8f8f5;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>
<body>
<header>
    <h1>Face Attendance System</h1>
    <a th:href="@{/dashboard}">Dashboard</a>
</header>

<nav>
    <ul>
        <li><a th:href="@{/students/view}">View Students</a></li>
        <li><a th:href="@{/students/add}">Add Student</a></li>
        <li><a th:href="@{/attendance}">View Attendance</a></li>
    </ul>
</nav>

<h2 class="page-title">All Students</h2>

<div class="add-btn-container">
    <a th:href="@{/students/add}" class="btn">+ Add New Student</a>
</div>

<table>
    <tr>
        <th>Name</th>
        <th>Roll Number</th>
        <th>Email</th>
        <th>Photo Path</th>
        <th>Actions</th>
    </tr>
    <tr th:each="student : ${students}">
        <td th:text="${student.name}"></td>
        <td th:text="${student.rollNumber}"></td>
        <td th:text="${student.email}"></td>
        <td th:text="${student.photoPath}"></td>
        <td>
            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn">Edit</a>
            <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-delete" onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
        </td>
    </tr>
</table>

<footer>
    <p>&copy; 2026 Face Attendance System</p>
</footer>
</body>
</html>
