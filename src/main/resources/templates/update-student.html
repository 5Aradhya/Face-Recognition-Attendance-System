<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
        }

        header {
            background-color: #2c3e50;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: white;
            font-size: 26px;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
        }

        header a:hover {
            background-color: #1abc9c;
        }

        nav {
            background-color: #34495e;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
        }

        nav ul li a:hover {
            background-color: #1abc9c;
        }

        .page-title {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .form-container {
            background-color: white;
            width: 90%;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #34495e;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccd1d6;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border-color: #1abc9c;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #16a085;
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #34495e;
            text-decoration: none;
        }

        .cancel-link:hover {
            color: #1abc9c;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

<header>
    <h1>Face Attendance System</h1>
    <a th:href="@{/dashboard}">Dashboard</a>
</header>

<nav>
    <ul>
        <li><a th:href="@{/students/view}">View Students</a></li>
        <li><a th:href="@{/students/add}">Add Student</a></li>
        <li><a th:href="@{/attendance}">View Attendance</a></li>
    </ul>
</nav>

<h2 class="page-title">Update Student</h2>

<div class="form-container">
    <form th:action="@{/students/update/{id}(id=${student.id})}" method="post" th:object="${student}">

        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Roll Number</label>
        <input type="text" th:field="*{rollNumber}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Photo Path</label>
        <input type="text" th:field="*{photoPath}">

        <button type="submit">Update Student</button>
    </form>

    <a th:href="@{/students/view}" class="cancel-link">Cancel</a>
</div>

<footer>
    <p>&copy; 2026 Face Attendance System</p>
</footer>

</body>
</html>
